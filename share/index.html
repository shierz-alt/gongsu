  <style>
    :root {
      --bg-color: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --purple: #a855f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: calc(env(safe-area-inset-top, 0px) + 18px) 14px calc(env(safe-area-inset-bottom, 0px) + 120px) 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 2px;
    }

    .header-title {
      font-size: 19px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-subtitle {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 1px;
    }

    .btn-settings {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Summary Card */
    .summary-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px 18px;
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .summary-card::before {
      content: "";
      position: absolute;
      top: -30px;
      right: -30px;
      width: 110px;
      height: 110px;
      background: var(--accent-glow);
      border-radius: 50%;
      filter: blur(35px);
      pointer-events: none;
    }

    .summary-flex {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .summary-label {
      font-size: 13px;
      color: var(--text-sub);
      font-weight: 600;
    }

    .summary-gongsu {
      font-size: 34px;
      font-weight: 800;
      color: var(--accent);
      line-height: 1.1;
      margin-top: 2px;
    }

    .summary-gongsu span {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-sub);
      margin-left: 2px;
    }

    .work-days {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .pay-box {
      text-align: right;
    }

    .pay-box-label {
      font-size: 12px;
      color: var(--text-muted);
    }

    .pay-box-val {
      font-size: 25px;
      font-weight: 800;
      color: var(--success);
      margin-top: 2px;
      letter-spacing: -0.5px;
    }

    /* Month Navigator */
    .month-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 8px 14px;
    }

    .month-title {
      font-size: 16px;
      font-weight: 700;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 16px;

  <script>
    function getTodayStr() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    const todayStr = getTodayStr();
    let currentDate = new Date();
    let selectedDateStr = todayStr;
    let wagePerGongsu = 150000;
    let satBonus = 0.5;
    let autoSatBonus = false;
    let gongsuData = {};
    let breakfastData = {};

    function loadData() {
      try {
        const savedWage = localStorage.getItem("shipyard_wage");
        if (savedWage) wagePerGongsu = parseInt(savedWage) || 150000;

        const savedBonus = localStorage.getItem("shipyard_sat_bonus");
        if (savedBonus !== null) satBonus = parseFloat(savedBonus);
        if (isNaN(satBonus)) satBonus = 0.5;

        const savedAutoSat = localStorage.getItem("shipyard_auto_sat");
        if (savedAutoSat !== null) autoSatBonus = savedAutoSat === "true";

        const savedBreakfast = localStorage.getItem("shipyard_breakfast");
        if (savedBreakfast) breakfastData = JSON.parse(savedBreakfast);

        const savedGongsu = localStorage.getItem("shipyard_gongsu_share");
        if (savedGongsu) {
          gongsuData = JSON.parse(savedGongsu);
        } else {
          gongsuData = {};
          saveGongsu();
        }
      } catch (e) {
        console.error(e);
      }
    }

    function saveGongsu() {
      localStorage.setItem("shipyard_gongsu_share", JSON.stringify(gongsuData));
    }

    function saveBreakfast() {
      localStorage.setItem("shipyard_breakfast", JSON.stringify(breakfastData));
    }

    function toggleBreakfast() {
      if (!selectedDateStr) return;
      if (breakfastData[selectedDateStr]) {
        delete breakfastData[selectedDateStr];
      } else {
        breakfastData[selectedDateStr] = true;
      }
      saveBreakfast();
      updateQuickLabels();
      renderCalendar();
    }

    function saveWage() {
      localStorage.setItem("shipyard_wage", wagePerGongsu.toString());
      localStorage.setItem("shipyard_sat_bonus", satBonus.toString());
      localStorage.setItem("shipyard_auto_sat", autoSatBonus.toString());
    }

    const fmtWon = (num) => Math.round(num).toLocaleString("ko-KR") + "원";
    const fmtMan = (num) => {
      const man = Math.round((num / 10000) * 10) / 10;
      return `${man}만`;
    };

    function isSaturday(dateStr) {
      const [y, m, d] = dateStr.split("-").map(Number);
      return new Date(y, m - 1, d).getDay() === 6;
    }

    function updateQuickLabels() {
      const satActive = isSaturday(selectedDateStr) && autoSatBonus && satBonus > 0;
      const badge = document.getElementById("satBadge");
      if (satActive) {
        badge.style.display = "inline-block";
        badge.innerText = `토요 특근 +${satBonus}`;
      } else {
        badge.style.display = "none";
      }

      const bonus = satActive ? satBonus : 0;

    function updateSummary() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth() + 1;
      const monthPrefix = `${year}-${String(month).padStart(2, '0')}`;

      let total = 0;
      let days = 0;
      let mealCount = 0;

      for (let dateKey in gongsuData) {
        if (dateKey.startsWith(monthPrefix) && gongsuData[dateKey] > 0) {
          total += gongsuData[dateKey];
          days++;
        }
      }

      for (let dateKey in breakfastData) {
        if (dateKey.startsWith(monthPrefix) && breakfastData[dateKey]) {
          mealCount++;
        }
      }

      total = Math.round(total * 100) / 100;
      document.getElementById("totalGongsu").innerHTML = `${total}<span>공수</span>`;
      document.getElementById("workDays").innerText = `근무일수 ${days}일`;
      document.getElementById("summaryMonthLabel").innerText = `${year}년 ${month}월 누적`;
      document.getElementById("unitRateDisplay").innerText = `1공수 기준: ${fmtWon(wagePerGongsu)}`;

      const mealDeduct = mealCount * 500;
      const totalAmount = Math.max(0, total * wagePerGongsu - mealDeduct);
      document.getElementById("totalPay").innerText = fmtWon(totalAmount);

      const mealInfoEl = document.getElementById("mealDeductInfo");
      if (mealCount > 0) {
        mealInfoEl.style.display = "block";
        mealInfoEl.innerText = `🍚 아침 ${mealCount}회 (-${fmtWon(mealDeduct)})`;
      } else {
        mealInfoEl.style.display = "none";
      }
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById("calendarTitle").innerText = `${year}년 ${month + 1}월`;

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      const prevLastDate = new Date(year, month, 0).getDate();

      const grid = document.getElementById("daysGrid");
      grid.innerHTML = "";

      for (let i = firstDay - 1; i >= 0; i--) {
        const cell = document.createElement("div");
        cell.className = "day-cell other-month";
        cell.innerHTML = `<span class="day-num">${prevLastDate - i}</span>`;
        grid.appendChild(cell);
      }

      for (let day = 1; day <= lastDate; day++) {
        const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayOfWeek = new Date(year, month, day).getDay();

        const cell = document.createElement("div");
        cell.className = "day-cell";
        if (dayOfWeek === 0) cell.classList.add("sun");
        if (dayOfWeek === 6) cell.classList.add("sat");
        if (dateKey === todayStr) cell.classList.add("today");
        if (dateKey === selectedDateStr) cell.classList.add("selected");

        let badgeHtml = "";
        const val = gongsuData[dateKey];
        if (val !== undefined && val > 0) {
          let badgeClass = "gongsu-1";
          if (val === 0.9) badgeClass = "gongsu-09";
          else if (val > 1.0) badgeClass = "gongsu-over";
          else if (val < 1.0) badgeClass = "gongsu-half";
          badgeHtml = `<div class="gongsu-badge ${badgeClass}">${val}</div>`;
        }

        const mealHtml = breakfastData[dateKey] ? `<span class="meal-dot">🍚</span>` : "";

        cell.innerHTML = `
          <span class="day-num">${day}</span>
          ${mealHtml}
          ${badgeHtml}
        `;

        cell.onclick = () => selectDate(dateKey);
        grid.appendChild(cell);
      }

      updateSummary();
    }

    function selectDate(dateStr) {
      selectedDateStr = dateStr;
      const parts = dateStr.split("-");
      const [y, m, d] = parts.map(Number);
      const daysKo = ["일", "월", "화", "수", "목", "금", "토"];
      const dow = daysKo[new Date(y, m - 1, d).getDay()];
      document.getElementById("selectedDateDisplay").innerText = `${m}월 ${d}일 (${dow})`;
      updateQuickLabels();
      renderCalendar();
    }

    function setQuickBase(baseVal) {
      const satActive = isSaturday(selectedDateStr) && autoSatBonus && satBonus > 0;
      const finalVal = Math.round((baseVal + (satActive ? satBonus : 0)) * 100) / 100;
      setGongsu(finalVal);
    }

    function addTeukgeun() {
      if (!selectedDateStr) return;
      const current = gongsuData[selectedDateStr] || 0;
      const nextVal = Math.round((current + satBonus) * 100) / 100;
      setGongsu(nextVal);
    }

    function setGongsu(val) {
      if (!selectedDateStr) return;
      if (val === 0) {
        delete gongsuData[selectedDateStr];
      } else {
        gongsuData[selectedDateStr] = Math.round(val * 100) / 100;
      }
      saveGongsu();
      renderCalendar();
    }

    function promptCustomGongsu() {
      if (!selectedDateStr) return;
      const currentVal = gongsuData[selectedDateStr] || "";
      const input = prompt("입력할 공수를 적어주세요 (예: 0.8, 1.3, 1.75):", currentVal);
      if (input !== null) {
        const num = parseFloat(input);
        if (!isNaN(num) && num > 0) {
          setGongsu(num);
        } else if (input.trim() === "0" || input.trim() === "") {
          setGongsu(0);
        }
      }
    }

    function prevMonth() {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    }

    function nextMonth() {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    }

    function openSettings() {
      document.getElementById("wageInput").value = wagePerGongsu;
      document.getElementById("satBonusInput").value = satBonus;
      document.getElementById("autoSatBonusInput").checked = autoSatBonus;
      document.getElementById("settingsModal").classList.add("open");
    }

    function closeSettings() {
      document.getElementById("settingsModal").classList.remove("open");
    }

    function saveSettings() {
      const wage = parseInt(document.getElementById("wageInput").value) || 150000;
      const bonus = parseFloat(document.getElementById("satBonusInput").value);
      wagePerGongsu = wage;
      satBonus = isNaN(bonus) || bonus < 0 ? 0.5 : bonus;
      autoSatBonus = document.getElementById("autoSatBonusInput").checked;
      saveWage();
      closeSettings();
      updateQuickLabels();
      renderCalendar();
    }

    function exportBackup() {
      const payload = JSON.stringify({ gongsu: gongsuData, breakfast: breakfastData });
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(payload).then(() => {
          alert("기록이 복사되었습니다! 새 링크 설정에서 '기록 붙여넣기'를 누르세요.");
        }).catch(() => {
          prompt("아래 내용을 전체 복사하세요:", payload);
        });
      } else {
        prompt("아래 내용을 전체 복사하세요:", payload);
      }
    }

    function importBackup() {
      const text = prompt("복사한 기록을 붙여넣어 주세요:");
      if (!text) return;
      try {
        const parsed = JSON.parse(text.trim());
        if (parsed.gongsu) gongsuData = parsed.gongsu;
        if (parsed.breakfast) breakfastData = parsed.breakfast;
        saveGongsu();
        saveBreakfast();
        closeSettings();
        updateQuickLabels();
        renderCalendar();
        alert("기록이 복원되었습니다!");
      } catch (e) {
        alert("올바른 백업 형식이 아닙니다.");
      }
    }

    let menuData = DEFAULT_MENU_DATA;
    let currentVendor = "pulmuone";
    let currentMeal = "중식";
    let currentDayIdx = 0;

    function initMenuSync() {
      try {
        if (location.hash && location.hash.startsWith("#m=")) {
          const b64 = location.hash.slice(3).replace(/-/g, "+").replace(/_/g, "/");
          const binStr = atob(b64);
          const bytes = Uint8Array.from(binStr, c => c.charCodeAt(0));
          const jsonStr = new TextDecoder().decode(bytes);
          const parsed = JSON.parse(jsonStr);
          if (parsed && (parsed.pulmuone || parsed.welliv)) {
            localStorage.setItem("shipyard_menus", JSON.stringify(parsed));
            history.replaceState(null, "", location.pathname);
            const tb = document.getElementById("toastBanner");
            tb.style.display = "block";
            tb.innerText = "✅ 오늘 한화오션 식단표가 업데이트되었습니다! (" + (parsed.updated || "최신") + ")";
          }
        }
        const savedMenu = localStorage.getItem("shipyard_menus");
        if (savedMenu) {
          menuData = JSON.parse(savedMenu);
        }
      } catch (e) { console.error("Menu sync error", e); }
      document.getElementById("menuUpdatedAt").innerText = (menuData.updated || "2026-11-16") + " 기준";
    }

    function switchMainTab(tab) {
      const isGongsu = tab === "gongsu";
      document.getElementById("viewGongsu").style.display = isGongsu ? "flex" : "none";
      document.getElementById("viewMeal").style.display = isGongsu ? "none" : "flex";
      document.getElementById("mainTabGongsu").classList.toggle("active", isGongsu);
      document.getElementById("mainTabMeal").classList.toggle("active", !isGongsu);
      if (!isGongsu) {
        document.getElementById("dayTabs").style.display = "flex";
        loadWeather();
        renderDayTabs();
        renderMenus();
      }
    }

    function switchVendor(v) {
      currentVendor = v;
      currentDayIdx = 0;
      document.getElementById("tabPul").classList.toggle("active", v === "pulmuone");
      document.getElementById("tabWel").classList.toggle("active", v === "welliv");
      document.getElementById("dayTabs").style.display = "flex";
      document.getElementById("btnNight").style.display = v === "pulmuone" ? "block" : "none";
      if (v === "welliv" && currentMeal === "야식") currentMeal = "중식";
      renderDayTabs();
      renderMenus();
    }

    function switchMeal(m) {
      currentMeal = m;
      renderMenus();
    }

    function switchDay(idx) {
      currentDayIdx = idx;
      renderDayTabs();
      renderMenus();
    }

    function renderDayTabs() {
      const box = document.getElementById("dayTabs");
      box.innerHTML = "";
      const list = currentVendor === "pulmuone" ? (menuData.pulmuone_days || []) : (menuData.welliv || []);
      list.forEach((d, idx) => {
        const btn = document.createElement("button");
        btn.className = "sub-btn" + (idx === currentDayIdx ? " active" : "");
        btn.innerText = d.date;
        btn.onclick = () => switchDay(idx);
        box.appendChild(btn);
      });
    }

    function renderMenus() {
      const box = document.getElementById("menuList");
      box.innerHTML = "";
      document.querySelectorAll("#mealTabs .sub-btn").forEach(b => {
        b.classList.toggle("active", b.innerText === currentMeal);
      });
      if (currentVendor === "pulmuone") {
        const dayObj = (menuData.pulmuone_days || [])[currentDayIdx];
        const list = (dayObj && dayObj.meals && dayObj.meals[currentMeal]) || [];
        if (!list.length) {
          box.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:16px 0;font-size:13px;">${currentMeal} 메뉴가 없습니다.</div>`;
          return;
        }
        list.forEach(item => {
          const div = document.createElement("div");
          div.className = "corner-card";
          div.innerHTML = `<div class="corner-name">${item.corner}</div><div class="corner-main">${item.title}</div><div class="corner-detail">${item.detail}</div>`;
          box.appendChild(div);
        });
      } else {
        const dayObj = (menuData.welliv || [])[currentDayIdx];
        const list = (dayObj && dayObj.meals && dayObj.meals[currentMeal]) || [];
        if (!list.length) {
          box.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:16px 0;font-size:13px;">${currentMeal} 메뉴가 없습니다.</div>`;
          return;
        }
        list.forEach(item => {
          const div = document.createElement("div");
          div.className = "corner-card";
          div.innerHTML = `<div class="corner-name">${item.corner}</div><div class="corner-main">${item.items[0] || ""}</div><div class="corner-detail">${item.items.join(" · ")}</div>`;
          box.appendChild(div);
        });
      }
    }

    function wmoText(code) {
      if (code === 0) return "맑음 ☀️";
      if (code <= 3) return "구름 ⛅";
      if (code <= 48) return "안개 🌫️";
      if (code <= 67 || (code >= 80 && code <= 82)) return "비 🌧️";
      if (code <= 77) return "눈 ❄️";
      return "흐림 ☁️";
    }

    const WEATHER_CACHE_KEY = "yard_weather_cache_v2";
    const WEATHER_TTL_MS = 15 * 60 * 1000;
    const YARD_NAMES = ["옥포동", "아주동", "장승포동"];

    function wttrText(code) {
      const c = Number(code);
      if (c === 113) return "맑음 ☀️";
      if (c === 116 || c === 119) return "구름 ⛅";
      if (c === 122) return "흐림 ☁️";
      if (c === 143 || c === 248 || c === 260) return "안개 🌫️";
      if (c >= 176 && c <= 314) return "비 🌧️";
      if (c >= 317 && c <= 395) return "눈/비 ❄️";
      return "구름 ⛅";
    }

    function renderWeatherList(list, timeText) {
      const grid = document.getElementById("weatherGrid");
      grid.innerHTML = "";
      list.forEach(({ name, temp, min, max, rain, wind, desc }) => {
        const box = document.createElement("div");
        box.className = "w-box";
        box.innerHTML = `<div class="w-loc">${name}</div><div class="w-temp">${temp}°</div><div class="w-desc">${desc}<br>${min}° / ${max}° · 비 ${rain}%</div><div class="w-wind">바람 ${wind} m/s</div>`;
        grid.appendChild(box);
      });
      if (timeText) document.getElementById("weatherTime").innerText = timeText;
    }

    async function fetchWithTimeout(url, ms) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), ms);
      try {
        const res = await fetch(url, { signal: ctrl.signal });
        if (!res.ok) throw new Error("http " + res.status);
        return await res.json();
      } finally {
        clearTimeout(t);
      }
    }

    async function fetchOpenMeteoFast() {
      const url = "https://api.open-meteo.com/v1/forecast?latitude=34.892,34.868,34.864&longitude=128.690,128.698,128.724&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&wind_speed_unit=ms&timezone=Asia%2FSeoul&forecast_days=1";
      const arr = await fetchWithTimeout(url, 3500);
      const items = Array.isArray(arr) ? arr : [arr];
      return items.map((data, idx) => ({
        name: YARD_NAMES[idx] || "거제",
        temp: Math.round(data.current.temperature_2m),
        min: Math.round(data.daily.temperature_2m_min[0]),
        max: Math.round(data.daily.temperature_2m_max[0]),
        rain: data.daily.precipitation_probability_max[0],
        wind: data.current.wind_speed_10m,
        desc: wmoText(data.current.weather_code)
      }));
    }

    async function fetchWttrFast() {
      const q = ["Okpo,Geoje", "Aju,Geoje", "Jangseungpo,Geoje"];
      const arr = await Promise.all(q.map((loc) => fetchWithTimeout(`https://wttr.in/${loc}?format=j1`, 4000)));
      return arr.map((d, idx) => {
        const cur = d.current_condition[0];
        const day = d.weather[0];
        const maxRain = Math.max(...(day.hourly || []).map(h => Number(h.chanceofrain || 0)), 0);
        const windMs = Math.round((Number(cur.windspeedKmph || 0) / 3.6) * 10) / 10;
        return {
          name: YARD_NAMES[idx],
          temp: Math.round(Number(cur.temp_C)),
          min: Math.round(Number(day.mintempC)),
          max: Math.round(Number(day.maxtempC)),
          rain: maxRain,
          wind: windMs,
          desc: wttrText(cur.weatherCode)
        };
      });
    }

    let weatherLoading = false;
    async function loadWeather(force) {
      let cached = null;
      try {
        const raw = localStorage.getItem(WEATHER_CACHE_KEY);
        if (raw) {
          cached = JSON.parse(raw);
          if (cached && Array.isArray(cached.list) && cached.list[0] && cached.list[0].temp !== undefined) {
            renderWeatherList(cached.list, cached.timeText);
            if (!force && (Date.now() - cached.ts) < WEATHER_TTL_MS) return;
          }
        }
      } catch (e) {}

      if (weatherLoading) return;
      weatherLoading = true;
      try {
        const list = await fetchWttrFast();
        const now = new Date();
        const timeText = `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")} 실시간`;
        renderWeatherList(list, timeText);
        try {
          localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify({ ts: Date.now(), timeText, list }));
        } catch (e) {}
      } catch (e) {
        if (!cached) document.getElementById("weatherTime").innerText = "날씨 조회 실패";
      } finally {
        weatherLoading = false;
      }
    }

    initMenuSync();
    loadWeather();

    loadData();
    selectDate(selectedDateStr);
  </script>
</body>
</html>
